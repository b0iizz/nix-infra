<!--
  Appended to the <head> of every copyparty page (`html-head` in
  copyparty.nix), after the generated part (the font and the
  `copyparty.accent` colours). The look of nas.grebes.net, a family archive:
  quiet ink on a mineral ground, and one accent, Ruff (the chestnut of a
  great crested grebe's ruff), that only marks where you are: the selected
  folder, the open panel, the selection and keyboard focus.

  It restyles copyparty's flat themes, `html.b.y` light (the default, theme
  3) and `html.b.z` dark (theme 2), mostly through copyparty's own colour
  variables (its browser.css), and replaces the emoji buttons with Lucide
  icons (ISC licence, lucide.dev), drawn as masks in the text colour. The
  other themes stay as they ship.
-->

  html.b.y {
    --ink: #1b2220;
    --slate: #5c6863;
    --mineral: #edf0ee;
    --paper: #f9faf9;
    --rule: #d2d9d6;
    --ruff: var(--accent-light);
    --hover: #e3e8e5;
  }
  html.b.z {
    --ink: #dee4e1;
    --slate: #93a09a;
    --mineral: #131715;
    --paper: #1a1f1d;
    --rule: #2c3431;
    --ruff: var(--accent-dark);
    --hover: #222826;
  }
  /* copyparty's own variables, from the tokens above */
  html.b.y,
  html.b.z {
    --fg: var(--ink);
    --fg-max: var(--ink);
    --fg-weak: var(--slate);
    --bg: var(--mineral);
    --bgg: var(--mineral);
    --bg-d1: var(--paper);
    --bg-d2: var(--rule);
    --bg-d3: var(--rule);
    --bg-u1: var(--paper);
    --bg-u2: var(--paper);
    --bg-u3: var(--paper);
    --bg-u4: var(--paper);
    --bg-u5: var(--rule);
    --bg-u6: var(--rule);
    --bg-max: var(--paper);
    --tree-bg: var(--mineral);
    --row-alt: var(--mineral);
    --tab-alt: var(--slate);
    --a: var(--ink);
    --a-b: var(--ink);
    --a-hil: var(--ruff);
    --a-gray: var(--slate);
    --a-dark: var(--slate);
    --btn-fg: var(--ink);
    --btn-bg: transparent;
    --btn-h-fg: var(--ink);
    --btn-h-bg: var(--hover);
    --btn-1-fg: var(--paper);
    --btn-1-bg: var(--ruff);
    --btn-1h-fg: var(--paper);
    --btn-1h-bg: var(--ruff);
    --btn-bs: none;
    --btn-1-bs: none;
    --op-aa-bg: transparent;
    --op-a-sh: transparent;
    --sort-1: var(--ink);
    --sort-2: var(--slate);
    --srv-1: var(--slate);
    --srv-2: var(--slate);
    --srv-3: var(--slate);
    --sz-b: var(--slate);
    --sz-k: var(--slate);
    --scroll: var(--rule);
    --g-sel-fg: var(--paper);
    --g-sel-bg: var(--ruff);
    --g-fsel-bg: var(--ruff);
    --f-h-b1: var(--rule);
    --f-sel-sh: var(--ruff);
    --f-gray: var(--slate);
    --u2-tab-1-b1: var(--ruff);
    --u2-tab-1-b2: var(--ruff);
    --u2-tab-1-sh: transparent;
    --u2-sbtn-b1: var(--ruff);
    --txt-sh: transparent;
  }
  html.b :focus-visible {
    outline: 2px solid var(--ruff);
    outline-offset: 2px;
  }
  html.b #files td:nth-child(3),
  html.b #files td:nth-child(5) {
    font-family: var(--font-main);
    font-variant-numeric: tabular-nums;
  }

  /* the file list: one table, hairline rows, no boxes */
  html.b #files {
    width: 100%;
  }
  html.b #files thead th {
    font-size: 0.85em;
    font-weight: 600;
    color: var(--slate);
    text-align: left;
    padding: 0.5em 0.8em;
  }
  html.b #files thead th:first-child {
    text-align: center;
  }
  html.b #files thead th:nth-child(3) {
    text-align: right;
  }
  html.b #files td,
  html.b #files tr:nth-child(2n + 1) td + td {
    background: transparent;
    box-shadow: none;
    border-radius: 0;
    border-bottom: 1px solid var(--rule);
    padding: 0.55em 0.8em;
  }
  html.b #files tbody tr:hover td {
    background: var(--hover);
  }
  html.b #files tbody tr.sel td,
  html.b #files tbody tr.sel td a {
    color: var(--paper);
    background: var(--ruff);
  }
  html.b #wfp {
    font-size: 1em;
    font-weight: 400;
  }

  /* icons: the button's emoji is hidden (font-size 0), its --i drawn instead */
  html.b #ops a:not(:has(svg)),
  html.b #treeh a[id]:not(#dyntree),
  html.b #entree,
  html.b
    #wtoggle
    :is(
      #fshr,
      #fren,
      #fdel,
      #fcut,
      #fcpy,
      #fpst,
      #zip1,
      #npirc,
      #nptxt,
      #m3ua,
      #m3uc,
      #wtgrid,
      #wtico
    ) {
    font-size: 0;
    color: var(--slate);
  }
  html.b #ops a:not(:has(svg))::before,
  html.b #treeh a[id]:not(#dyntree)::before,
  html.b #entree::before,
  html.b
    #wtoggle
    :is(
      #fshr,
      #fren,
      #fdel,
      #fcut,
      #fcpy,
      #fpst,
      #zip1,
      #npirc,
      #nptxt,
      #m3ua,
      #m3uc,
      #wtgrid,
      #wtico
    )::before {
    content: "";
    display: inline-block;
    vertical-align: middle;
    width: 20px;
    height: 20px;
    background: currentColor;
    mask: var(--i) center / contain no-repeat;
  }
  html.b #wtoggle a span {
    display: block;
    font-size: 11px;
    line-height: 1.4;
  }
  html.b #ops a {
    padding: 10px 11px 8px;
    border-bottom: 2px solid transparent;
  }
  html.b #ops a:hover,
  html.b #treeh a[id]:hover,
  html.b #wtoggle a:hover {
    color: var(--ink);
    background: var(--hover);
  }
  html.b #ops a.act {
    color: var(--ruff);
    background: transparent;
    border-radius: 0;
    border-bottom: 2px solid var(--ruff);
  }
  html.b #treeh a.on,
  html.b #wtoggle a.on {
    color: var(--ruff);
    background: transparent;
  }
  html.b
    #wtoggle
    :is(
      #fshr,
      #fren,
      #fdel,
      #fcut,
      #fcpy,
      #fpst,
      #zip1,
      #npirc,
      #nptxt,
      #m3ua,
      #m3uc,
      #wtgrid,
      #wtico
    ) {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    vertical-align: top;
    height: 44px;
    min-width: 40px;
    padding: 0 4px;
  }
  html.b #treeh .btn,
  html.b #detree {
    padding: 4px 6px;
    border-radius: var(--radius);
  }
  html.b #opa_x {
    --i: var(--i-x);
  }
  html.b #opa_srch {
    --i: var(--i-search);
  }
